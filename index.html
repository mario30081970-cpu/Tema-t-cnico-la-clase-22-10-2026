<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor 3D · Clase 22/10/2026 (2)</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #f4f5f7;
    --bar: #ffffff;
    --text: #1f2933;
    --muted: #6b7280;
    --line: #e2e5ea;
    --accent: #2f5d8a;
    --btn-bg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181c;
      --bar: #1c2026;
      --text: #e6e9ed;
      --muted: #9aa3ad;
      --line: #2c323a;
      --accent: #7fb0de;
      --btn-bg: #1c2026;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body { display: flex; flex-direction: column; }

  header {
    flex: 0 0 auto;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 16px 10px;
    background: var(--bar);
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: baseline;
    gap: 12px;
    min-width: 0;
  }
  header h1 {
    margin: 0;
    font-size: 0.95rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  header span {
    font-size: 0.8rem;
    color: var(--muted);
    white-space: nowrap;
  }

  main { position: relative; flex: 1 1 auto; min-height: 0; }

  model-viewer {
    width: 100%;
    height: 100%;
    background: transparent;
    --poster-color: transparent;
    --progress-bar-color: var(--accent);
    --progress-bar-height: 2px;
    outline: none;
  }

  .controls {
    position: absolute;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }
  .controls button {
    font: inherit;
    font-size: 0.85rem;
    color: var(--text);
    background: var(--btn-bg);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 14px;
    cursor: pointer;
    min-height: 40px;
    -webkit-tap-highlight-color: transparent;
  }
  .controls button:hover { border-color: var(--accent); }
  .controls button[aria-pressed="true"] {
    border-color: var(--accent);
    color: var(--accent);
  }
  .controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  #msg {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    color: var(--muted);
    font-size: 0.9rem;
    pointer-events: none;
  }
</style>
</head>
<body>

<header>
  <h1 id="titulo">Tema técnico de la clase</h1>
  <span>22/10/2026</span>
</header>

<main>
  <model-viewer
    id="visor"
    src="22_10_2026%282%29.glb"
    alt="Modelo 3D de la clase del 22/10/2026 (2)"
    camera-controls
    touch-action="none"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="20deg"
    interaction-prompt="none"
    shadow-intensity="0.6"
    exposure="1"
    environment-image="neutral"
    camera-orbit="auto auto auto"
    min-field-of-view="10deg"
    max-field-of-view="60deg">
  </model-viewer>

  <div id="msg">No se pudo cargar <code>22_10_2026(2).glb</code>. Verifica que esté en la misma carpeta que este archivo y abre la página desde un servidor (no con doble clic).</div>

  <div class="controls">
    <button id="btnRotar" type="button" aria-pressed="true">Rotación automática: sí</button>
    <button id="btnReset" type="button">Restaurar vista</button>
  </div>
</main>

<script>
  const visor = document.getElementById('visor');
  const btnRotar = document.getElementById('btnRotar');
  const btnReset = document.getElementById('btnReset');
  const msg = document.getElementById('msg');

  function actualizarBoton() {
    const activo = visor.hasAttribute('auto-rotate');
    btnRotar.setAttribute('aria-pressed', String(activo));
    btnRotar.textContent = 'Rotación automática: ' + (activo ? 'sí' : 'no');
  }

  btnRotar.addEventListener('click', () => {
    if (visor.hasAttribute('auto-rotate')) {
      visor.removeAttribute('auto-rotate');
    } else {
      visor.setAttribute('auto-rotate', '');
    }
    actualizarBoton();
  });

  btnReset.addEventListener('click', () => {
    visor.cameraOrbit = 'auto auto auto';
    visor.cameraTarget = 'auto auto auto';
    visor.fieldOfView = 'auto';
    visor.jumpCameraToGoal();
  });

  visor.addEventListener('error', () => { msg.style.display = 'flex'; });
</script>
</body>
</html>
